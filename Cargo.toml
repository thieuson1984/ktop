[package]
name = "ktop"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Compact Linux system monitor and PID-safe terminal process manager"
license = "MIT"
readme = "README.md"

[dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
